<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réseaux pour les nuls</title>
<link rel="icon" href="assets/img/favicon.png">
<script>
  /* thème avant affichage (évite le flash) */
  try { var t = localStorage.getItem('reseaux-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/widgets.css">
<link rel="stylesheet" href="css/pt.css">

<body>
<button id="burger" aria-label="Menu">☰</button>
<aside id="sidebar">
  <div class="side-head">
    <h1 id="homeLink" title="Accueil">
      <span class="logo"><img src="assets/img/logo.svg" alt=""></span>
      <span>Réseaux <em>pour les nuls</em><small>Architecture, modèles et protocoles</small></span>
    </h1>
    <div class="global-progress">
      <div class="gp-bar"><div class="gp-fill" id="gpFill"></div></div>
      <div class="gp-label" id="gpLabel">0 %</div>
    </div>
    <div class="lvl-pick"><label for="lvlSel">Niveau</label><select id="lvlSel" title="Niveau de difficulté (optionnel)"></select></div>
  </div>
  <nav id="moduleList"></nav>
  <div class="side-foot">
    <div class="sf-row">
      <button id="btnFiche" class="sf-btn" title="Fiche de révision">📄 Fiche</button>
      <button id="btnTheme" class="sf-btn" title="Thème clair / sombre">🌙</button>
      <button id="btnReset" class="sf-btn danger" title="Tout remettre à zéro">↺ Réinitialiser</button>
    </div>
    <div class="sf-save" id="saveState">Sauvegarde : navigateur</div>
  </div>
</aside>
<main id="main"><div class="wrap" id="view"></div></main>
<div id="toast"></div>
<div id="confetti"></div>
